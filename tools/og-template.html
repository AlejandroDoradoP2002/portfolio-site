<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,400..700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1200px; height: 630px;
    overflow: hidden;
    background: #0a0a0a;
    color: #f0ead6;
    font-family: "Inter", system-ui, sans-serif;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 48px;
    padding: 64px 72px;
    overflow: hidden;
  }
  .atmos {
    position: absolute;
    inset: -10%;
    z-index: 0;
    background:
      radial-gradient(45% 40% at 25% 65%, rgba(212, 164, 55, 0.22) 0%, transparent 60%),
      radial-gradient(38% 35% at 80% 25%, rgba(184, 134, 42, 0.14) 0%, transparent 60%);
    pointer-events: none;
  }
  .left {
    position: relative;
    z-index: 2;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .top-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    color: #9c947d;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .top-meta .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #d4a437;
    box-shadow: 0 0 14px rgba(212, 164, 55, 0.55);
  }
  .name {
    font-family: "Newsreader", serif;
    font-weight: 300;
    font-size: 110px;
    line-height: 0.95;
    letter-spacing: -0.04em;
    color: #f0ead6;
    margin-top: 32px;
  }
  .name em {
    font-style: italic;
    color: #d4a437;
    font-weight: 400;
  }
  .role {
    font-family: "Newsreader", serif;
    font-size: 30px;
    font-weight: 300;
    line-height: 1.25;
    letter-spacing: -0.015em;
    color: #d6cfb8;
    margin-top: 18px;
    max-width: 580px;
  }
  .role em { font-style: italic; color: #f0ead6; }
  .stack {
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 28px;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    color: #d6cfb8;
  }
  .stack-tag {
    padding: 8px 14px;
    border: 1px solid rgba(240, 234, 214, 0.18);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.02);
  }
  .stack-tag.amber {
    border-color: #d4a437;
    color: #d4a437;
    background: rgba(212, 164, 55, 0.06);
  }
  .bottom-bar {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    font-family: "JetBrains Mono", monospace;
    font-size: 14px;
    color: #9c947d;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  .bottom-bar .url { color: #d4a437; }

  .right {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .portrait {
    width: 420px;
    height: 500px;
    border-radius: 12px;
    overflow: hidden;
    background: #161616;
    box-shadow:
      0 0 0 1px rgba(212, 164, 55, 0.18),
      0 40px 100px -30px rgba(0, 0, 0, 0.8);
    position: relative;
  }
  .portrait img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center 22%;
    filter: saturate(1.06) contrast(1.06);
    /* match site's mask-fade */
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 0%, #000 80%, transparent 100%);
  }
  .portrait-tint {
    position: absolute;
    inset: 0;
    background:
      radial-gradient(60% 50% at 25% 95%, rgba(212, 164, 55, 0.12) 0%, transparent 60%),
      linear-gradient(200deg, transparent 40%, rgba(10, 10, 10, 0.35) 100%);
    pointer-events: none;
  }
  .accent-line {
    position: absolute;
    bottom: 0;
    left: 72px;
    right: 72px;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212, 164, 55, 0.35), transparent);
    z-index: 3;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="atmos"></div>
    <div class="left">
      <div class="top-meta">
        <span class="dot"></span>
        <span>AD · 2026 · Portfolio</span>
      </div>
      <div>
        <h1 class="name">Alejandro<br><em>Dorado</em></h1>
        <p class="role">Backend engineer for <em>logistics workflows</em> and client integrations.</p>
        <div class="stack">
          <span class="stack-tag">Python</span>
          <span class="stack-tag amber">FastAPI</span>
          <span class="stack-tag">JavaScript</span>
          <span class="stack-tag">Lit</span>
          <span class="stack-tag">SQL Server</span>
        </div>
      </div>
      <div class="bottom-bar">
        <span>Backend Software Engineer · Remote · UTC-5</span>
        <span class="url">alejandro-dorado.com</span>
      </div>
    </div>
    <div class="right">
      <div class="portrait">
        <img src="../assets/img/photo-hero.jpg" alt="">
        <div class="portrait-tint"></div>
      </div>
    </div>
    <div class="accent-line"></div>
  </div>
</body>
</html>
